name: Upload packages from dist/ to PyPI
description: 'Uses twine to upload packages from dist/ to public or private PyPI'
inputs:
  pypi-pass:
    required: true
    description: 'Password of PyPI repository'

  pypi-name:
    required: false
    description: 'Name of PyPI repository'
    default: 'pypi'
  pypi-host:
    required: false
    description: 'Host of PyPI repository'
    default: 'https://upload.pypi.org/legacy/'
  pypi-user:
    required: false
    description: 'Username of PyPI repository'
    default: '__token__'
  pypi-simple-url:
    required: false
    description: 'Simple index used to verify the uploaded files. Default: https://<pypi-host>/simple/, or https://pypi.org/simple/ for PyPI'
    default: ''

runs:
  using: 'composite'
  steps:
  - id: install-tools
    shell: bash
    run: python3 -m pip install --upgrade twine packaging

  - id: setup-pypirc
    shell: bash
    env:
      pypi_name: ${{ inputs.pypi-name }}
      pypi_host: ${{ inputs.pypi-host }}
      pypi_user: ${{ inputs.pypi-user }}
      pypi_pass: ${{ inputs.pypi-pass }}
    run: |
      echo "[distutils]
      index-servers=
          $pypi_name

      [$pypi_name]
      repository: https://$pypi_host
      username: $pypi_user
      password: $pypi_pass
      " > ~/.pypirc

  # Uploads each file and downloads it again from the simple index. The job
  # fails unless the index serves exactly the built file. "Already exists" is
  # accepted only for an identical file (see upload.py).
  - id: upload
    shell: bash
    env:
      PYPI_REPOSITORY: ${{ inputs.pypi-name }}
      PYPI_HOST: ${{ inputs.pypi-host }}
      PYPI_SIMPLE_URL: ${{ inputs.pypi-simple-url }}
      PYPI_USER: ${{ inputs.pypi-user }}
      PYPI_PASS: ${{ inputs.pypi-pass }}
    run: |
      if [ -z "$PYPI_SIMPLE_URL" ]; then
        case "$PYPI_HOST" in
          *upload.pypi.org*) PYPI_SIMPLE_URL="https://pypi.org/simple/" ;;
          *) PYPI_SIMPLE_URL="https://${PYPI_HOST#https://}"; PYPI_SIMPLE_URL="${PYPI_SIMPLE_URL%/}/simple/" ;;
        esac
      fi
      export PYPI_SIMPLE_URL
      python3 "${{ github.action_path }}/upload.py"
